<!DOCTYPE html>
<html lang = "vi">
<head>
    <title>Tính tiền sản phẩm</title>
    <meta charset = "utf-8">
    <link rel = "stylesheet" href = "../css/style4.css">
</head>
<body>
    <table border = "1">
        <caption>HÓA ĐƠN MUA HÀNG</caption>
    <tr>
        <th>Tên sản phẩm</th>
        <th>Số lượng mua</th>
        <th>Đơn giá</th>
        <th>Thành tiền</th>
    </tr>

    <tr>
        <td>Bút bi</td>
        <td class = "sl">5</td>
        <td class = "dg">5000</td>
        <td class = "tt"></td>
    </tr>

    <tr>
        <td>Bút chì</td>
        <td class = "sl">4</td>
        <td class = "dg">3000</td>
        <td class = "tt"></td>
    </tr>

    <tr>
        <td>Gôm</td>
        <td class = "sl">2</td>
        <td class = "dg">3000</td>
        <td class = "tt"></td>
    </tr>

    <tr>
        <td>Bộ thước kẻ</td>
        <td class = "sl">1</td>
        <td class = "dg">15000</td>
        <td class = "tt"></td>
    </tr>

    <tr>
        <td>Bút xóa</td>
        <td class = "sl">1</td>
        <td class = "dg">10000</td>
        <td class = "tt"></td>
    </tr>

    <tr>
        <td>Hộp bút</td>
        <td class = "sl">1</td>
        <td class = "dg">25000</td>
        <td class = "tt"></td>
    </tr>

    <tr>
        <td>Tập</td>
        <td class = "sl">10</td>
        <td class = "dg">10000</td>
        <td class = "tt"></td>
    </tr>

    <tr>
        <td colspan = "3">Tổng thanh toán</td>
        <td id = "kq"></td>
    </tr>
</table>
<script>
    const soluong = document.getElementsByClassName("sl");
    const dongia = document.getElementsByClassName("dg");
    const thanhtien = document.getElementsByClassName("tt");
    let tongthanhtoan = 0;
    for(let i=0; i<soluong.length; i++)
    {
        thanhtien[i].innerHTML = soluong[i].innerHTML * dongia[i].innerHTML;
        tongthanhtoan += parseInt(thanhtien[i].innerHTML);
    }
    document.getElementById("kq").innerHTML = tongthanhtoan;
</script>
</body>
</html>
